# Reference / local-dev compose. Coolify deploys each service separately
# using its own UI (PostgreSQL/MinIO/n8n as managed Services, backend & frontend
# as Applications), but this file is useful for spinning the full stack up
# locally to test integration before pushing.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blueocean
      POSTGRES_PASSWORD: blueocean
      POSTGRES_DB: flashcards
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueocean -d flashcards"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/New_York
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://blueocean:blueocean@postgres:5432/flashcards
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/REPLACE_WITH_PROD_WEBHOOK_ID
      CORS_ORIGIN: http://localhost:3000
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started
    ports:
      - "3001:3001"

  frontend:
    build:
      context: .
      args:
        VITE_BACKEND_URL: http://localhost:3001
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  minio_data:
  n8n_data:
